[project]
name = "wano-ctf-backend"
version = "1.0.0"
description = "WANO CTF — FastAPI backend for a college-level offline cybersecurity Capture The Flag competition."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "storage", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
plugins = []

[tool.coverage.run]
source = ["app"]
omit = ["app/scripts/*", "tests/*"]
